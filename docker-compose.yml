version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: aarogyasaar-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: aarogyasaar
    volumes:
      - mongo_data:/data/db

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: aarogyasaar-ai
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    volumes:
      - ./uploads:/uploads

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aarogyasaar-backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGODB_URI=mongodb://mongodb:27017/aarogyasaar
      - JWT_SECRET=aarogyasaar_sih26047_ultra_secure_jwt_secret_key_2026
      - AI_SERVICE_URL=http://ai-service:8000
    depends_on:
      - mongodb
      - ai-service
    volumes:
      - ./uploads:/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aarogyasaar-frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3000/api
    depends_on:
      - backend

volumes:
  mongo_data:
